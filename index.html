<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ilhas da Luiza</title>
<meta name="description" content="Jogo de aventura e fantasia: construa, plante, crie animais e descubra ilhas.">
<meta name="theme-color" content="#3aa0d8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ilhas da Luiza">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--rosa:#ff6fa5;--roxo:#9b6cff;--azul:#3aa0d8;--texto:#3b2a4a;--papel:#fffaf3;--linha:#eadcf5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#2a7cc2;font-family:'Baloo 2',system-ui,sans-serif;color:var(--texto);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer}
#tela{position:fixed;inset:0;width:100%;height:100%;display:block}

#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;z-index:5}
.perfil{pointer-events:auto;display:flex;align-items:center;gap:7px;background:rgba(255,250,243,.94);border-radius:999px;padding:3px 14px 3px 3px;box-shadow:0 3px 0 rgba(0,0,0,.13);border:0}
#avatar{width:46px;height:46px;border-radius:50%;display:block}
#hudNome{font-weight:800;font-size:16px;line-height:1;text-align:left;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nivel{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;margin-top:2px}
.barra-xp{width:62px;height:9px;border-radius:9px;background:#eadcf5;overflow:hidden}
.barra-xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffcf3f,#ff8a4c);border-radius:9px;transition:width .4s}
.recursos{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;align-content:flex-start;max-width:52%}
.pill{background:rgba(255,250,243,.94);border-radius:999px;padding:2px 10px;font-weight:800;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.13);white-space:nowrap}
#dica{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);left:50%;transform:translateX(-50%);width:max-content;max-width:min(94vw,560px);background:rgba(59,42,74,.84);color:#fff;border-radius:14px;padding:4px 12px;font-size:13.5px;font-weight:600;text-align:center;z-index:4;line-height:1.25;cursor:pointer}
#lateral{position:fixed;right:8px;top:42%;display:flex;flex-direction:column;gap:8px;z-index:5}
#lateral button{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,250,243,.94);font-size:24px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.15);line-height:1}
#lateral #btnDescer{width:auto;border-radius:999px;font-size:15px;padding:0 12px;background:#ffc531}

#barra{position:fixed;left:0;right:0;bottom:0;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 7px);display:flex;justify-content:center;gap:5px;z-index:5}
#barra button{flex:1;max-width:88px;border:0;border-radius:18px;background:var(--papel);padding:5px 0 3px;font-weight:700;font-size:12px;box-shadow:0 4px 0 #cdb6e0;display:flex;flex-direction:column;align-items:center;position:relative;line-height:1.1}
#barra button b{font-size:25px;line-height:1.2;font-weight:400}
#barra button:active{transform:translateY(3px);box-shadow:0 1px 0 #cdb6e0}
.selo{position:absolute;top:-5px;right:2px;background:#ff4f6d;color:#fff;border-radius:999px;font-size:11px;min-width:19px;height:19px;line-height:19px;font-weight:800}

#modoConstruir{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:6px;align-items:center;background:var(--papel);border-radius:20px;padding:8px;z-index:6;box-shadow:0 4px 0 rgba(0,0,0,.15);max-width:560px;margin:0 auto}
.mc-txt{flex:1;font-weight:700;font-size:14px;line-height:1.2;padding-left:4px}

#fundo{position:fixed;inset:0;background:rgba(40,20,60,.32);z-index:8}
#painel{position:fixed;left:0;right:0;bottom:0;max-height:84vh;background:var(--papel);border-radius:26px 26px 0 0;z-index:9;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 24px rgba(0,0,0,.2);animation:sobe .22s ease-out;max-width:680px;margin:0 auto}
@keyframes sobe{from{transform:translateY(40px);opacity:0}}
.p-topo{display:flex;align-items:center;padding:12px 14px 4px;gap:8px}
.p-topo h2{flex:1;margin:0;font-size:22px;line-height:1.1}
#pFechar{width:42px;height:42px;border-radius:50%;border:0;background:#f3e6ff;font-size:18px;flex:none}
#pAbas{display:flex;gap:6px;padding:4px 12px 2px;overflow-x:auto;touch-action:pan-x;scrollbar-width:none}
.aba{border:0;border-radius:999px;padding:6px 13px;background:#f3e6ff;font-weight:700;font-size:14.5px;white-space:nowrap}
.aba.on{background:var(--roxo);color:#fff}
#pCorpo{overflow-y:auto;padding:8px 12px 18px;touch-action:pan-y;-webkit-overflow-scrolling:touch;user-select:text}

.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:9px}
.cartao{background:#fff;border:0;border-radius:18px;padding:9px 7px;box-shadow:0 3px 0 var(--linha);text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:flex-start;font-size:inherit}
.cartao.clicavel:active{transform:translateY(2px);box-shadow:0 1px 0 var(--linha)}
.cartao .ic{font-size:40px;line-height:1.1}
.cartao .nm{font-weight:800;font-size:15.5px;line-height:1.1}
.cartao .ds{font-size:12.5px;opacity:.78;line-height:1.2}
.cartao.trancado{opacity:.55;filter:grayscale(.7)}
.cartao .bts{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;width:100%}
.cartao .bts .btn{flex:1;padding:6px 6px;font-size:13.5px;min-height:38px}
.custo{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:14px;font-weight:800;margin-top:auto}
.custo .falta{color:#e8364f}
.btn{border:0;border-radius:15px;padding:8px 13px;font-weight:800;font-size:15px;background:var(--rosa);color:#fff;box-shadow:0 3px 0 #d94f86;min-height:44px;line-height:1.15}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d94f86}
.btn.verde{background:#3cc47c;box-shadow:0 3px 0 #2b9a5f}
.btn.azul{background:#3aa0d8;box-shadow:0 3px 0 #2a7fb0}
.btn.cinza{background:#c9bdd5;color:#3b2a4a;box-shadow:0 3px 0 #a99bb8}
.btn.amarelo{background:#ffc531;color:#5a3a00;box-shadow:0 3px 0 #d9a000}
.btn.grande{width:100%;font-size:19px;min-height:54px;border-radius:18px}
.btn:disabled{opacity:.45;transform:none}
.lista{display:flex;flex-direction:column;gap:8px}
.linha{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:8px 10px;box-shadow:0 3px 0 var(--linha);flex-wrap:wrap}
.linha .ic{font-size:32px;width:42px;text-align:center;flex:none;line-height:1}
.linha .tx{flex:1;line-height:1.2;min-width:140px}
.linha .tx b{display:block;font-size:15.5px}
.linha .tx small{opacity:.78;font-size:13px;display:block}
.linha .bts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.linha .bts .btn{min-height:38px;padding:6px 11px;font-size:13.5px}
.missao.feita{background:#e7fbef}
.prog{height:9px;border-radius:9px;background:#efe6f5;overflow:hidden;margin:4px 0 1px}
.prog i{display:block;height:100%;background:#3cc47c;border-radius:9px}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.acoes .btn{flex:1 1 150px}
.fala{font-size:16.5px;font-weight:600;line-height:1.3;margin:4px 0 10px}
.dica-p{font-size:14px;opacity:.85;line-height:1.3;margin:8px 0}
.premio{font-weight:800;text-align:center;margin:6px 0 0}
.conversa{display:flex;gap:12px;align-items:center}
.retrato{width:84px;height:84px;flex:none}
h3.grupo{margin:12px 2px 6px;font-size:17px}
h3.grupo small{font-weight:600;opacity:.7;font-size:13px}
.campo{width:100%;font-family:inherit;font-size:19px;font-weight:700;padding:10px 14px;border-radius:14px;border:3px solid #e4d2f3;background:#fff;color:var(--texto);outline:none;user-select:text}
.campo:focus{border-color:var(--roxo)}
.chip{display:inline-block;background:#f3e6ff;border-radius:999px;padding:2px 10px;margin:3px;font-weight:700;font-size:14px}
.novidades{margin-top:8px}

.agua{height:170px;border-radius:22px;background:linear-gradient(#9fdcff,#3d97d6 35%,#2a6fb5);position:relative;overflow:hidden}
.fio{position:absolute;left:50%;top:0;width:2px;height:46%;background:rgba(255,255,255,.8)}
.boia{position:absolute;left:50%;top:46%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:linear-gradient(#ff4f6d 50%,#fff 50%);box-shadow:0 2px 6px rgba(0,0,0,.25);animation:flutua 1.6s ease-in-out infinite}
.boia.mordeu{animation:afunda .18s ease-in-out infinite}
.boia.pegou{animation:none;transform:translateY(-60px) scale(1.3);transition:transform .3s}
@keyframes flutua{50%{transform:translateY(5px)}}
@keyframes afunda{0%,100%{transform:translateY(10px)}50%{transform:translateY(20px)}}
.onda{position:absolute;left:-10%;right:-10%;height:12px;border-radius:50%;border-top:3px solid rgba(255,255,255,.35)}
.onda.o1{top:60%;animation:ondula 3s linear infinite}.onda.o2{top:78%;animation:ondula 4s linear infinite reverse}
@keyframes ondula{50%{transform:translateX(6%)}}
.pesca-msg{text-align:center;font-size:19px;font-weight:800;min-height:50px;margin:10px 0}

#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 128px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:15;pointer-events:none;padding:0 10px}
.toast{background:#fff;border-radius:18px;padding:6px 16px;font-weight:800;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.2);animation:toast 2.9s forwards;max-width:92vw;text-align:center;line-height:1.25}
@keyframes toast{0%{transform:translateY(-10px) scale(.9);opacity:0}8%{transform:none;opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

#festa{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,20,60,.5);z-index:20;padding:16px}
.festa-caixa{background:var(--papel);border-radius:30px;padding:22px 18px 18px;max-width:390px;width:100%;text-align:center;animation:pula .45s cubic-bezier(.3,1.6,.5,1);max-height:90vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
@keyframes pula{from{transform:scale(.6);opacity:0}}
#festaIc{font-size:76px;line-height:1.05;animation:balanca 1.2s ease-in-out infinite}
@keyframes balanca{50%{transform:rotate(-8deg) scale(1.08)}}
#festaTit{margin:8px 0 4px;font-size:27px;color:#9b4bd8;line-height:1.1}
#festaTxt{font-size:16.5px;font-weight:600;line-height:1.3;margin:0 0 12px}
#festaExtra .campo{margin-bottom:12px;text-align:center}
#festaOk{width:100%}
#confete{position:fixed;inset:0;pointer-events:none;z-index:21;width:100%;height:100%}

#inicio{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(#8fd3ff 0%,#c9ecff 48%,#5ec2f0 48%,#2a8fd0 100%);overflow:hidden;text-align:center}
#inicio h1{font-size:clamp(42px,12vw,72px);line-height:.95;margin:0;color:#fff;text-shadow:0 4px 0 #ff6fa5,0 8px 0 #9b6cff,0 12px 20px rgba(0,0,0,.25);letter-spacing:1px}
#inicio .sub{font-size:18px;font-weight:700;color:#3b2a4a;margin:22px 0 8px;background:rgba(255,255,255,.75);padding:4px 14px;border-radius:999px}
.ilha-deco{font-size:64px;margin:6px 0;animation:balanca 3s ease-in-out infinite}
.bichos-deco{font-size:34px;letter-spacing:6px;margin-bottom:14px}
#inicioBotoes{display:flex;flex-direction:column;gap:10px;width:min(340px,100%)}
.nuvem{position:absolute;font-size:60px;opacity:.9;animation:nuvem 30s linear infinite}
@keyframes nuvem{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

#criador{position:fixed;inset:0;z-index:31;background:linear-gradient(#ffeef8,#f1e6ff);overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.cr-caixa{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.cr-caixa h1{margin:0 0 4px;text-align:center;font-size:28px;color:#9b4bd8}
.cr-previa{position:sticky;top:0;z-index:2;display:flex;justify-content:center;padding:4px 0;background:linear-gradient(#ffeef8 80%,rgba(255,238,248,0))}
.previa{width:190px;height:211px}
.cr-sec{background:#fff;border-radius:18px;padding:8px 12px 10px;margin:8px 0;box-shadow:0 3px 0 var(--linha)}
.cr-sec h3{margin:0 0 6px;font-size:16px}
.cr-op{display:flex;flex-wrap:wrap;gap:8px}
.cor{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e4d2f3}
.cor.on{box-shadow:0 0 0 3px var(--roxo);transform:scale(1.08)}
.chip-op{border:0;border-radius:999px;padding:7px 13px;background:#f3e6ff;font-weight:700;font-size:15px}
.chip-op.on{background:var(--roxo);color:#fff}
.cr-caixa > .btn.grande{margin-top:12px}
</style>
</head>
<body>
<canvas id="tela"></canvas>

<div id="hud">
  <button class="perfil" id="btnPerfil" aria-label="Meu visual"><canvas id="avatar" width="96" height="96"></canvas>
    <div><div id="hudNome">Luiza</div><div class="nivel"><span id="hudNivel">Nível 1</span><div class="barra-xp"><i id="hudXp"></i></div></div></div></button>
  <div class="recursos"><span class="pill" id="hudMoedas">🪙 0</span><span class="pill" id="hudMadeira">🪵 0</span><span class="pill" id="hudPedra">🪨 0</span><span class="pill" id="hudCristal" hidden>💎 0</span></div>
</div>
<div id="dica"></div>
<div id="lateral"><button id="zoomMais" aria-label="Aproximar">＋</button><button id="zoomMenos" aria-label="Afastar">－</button><button id="btnDescer" hidden>Descer 🐴</button></div>

<div id="barra">
  <button data-p="construir"><b>🔨</b>Construir</button>
  <button data-p="loja"><b>🛒</b>Loja</button>
  <button data-p="mochila"><b>🎒</b>Mochila</button>
  <button data-p="animais"><b>🐾</b>Bichos</button>
  <button data-p="missoes"><b>📜</b>Missões<span class="selo" id="seloMissoes" hidden>0</span></button>
  <button data-p="mais"><b>☰</b>Mais</button>
</div>
<div id="modoConstruir" hidden><div class="mc-txt" id="mcTxt"></div><button class="btn verde" id="mcOk">✔ Colocar</button><button class="btn cinza" id="mcSair">✖</button></div>

<div id="fundo" hidden></div>
<div id="painel" hidden><div class="p-topo"><h2 id="pTitulo"></h2><button id="pFechar" aria-label="Fechar">✖</button></div><div id="pAbas"></div><div id="pCorpo"></div></div>
<div id="toasts"></div>
<div id="festa" hidden><div class="festa-caixa"><div id="festaIc"></div><h2 id="festaTit"></h2><p id="festaTxt"></p><div id="festaExtra"></div><button class="btn grande" id="festaOk">Oba!</button></div></div>
<canvas id="confete"></canvas>

<div id="inicio">
  <div class="nuvem" style="top:8%;animation-delay:-4s">☁️</div><div class="nuvem" style="top:22%;animation-delay:-17s;font-size:44px">☁️</div>
  <div class="ilha-deco">🏝️</div>
  <h1>Ilhas da<br>Luiza</h1>
  <div class="sub">Aventura · Fazenda · Animais · Magia</div>
  <div class="bichos-deco">🐴🐰🐶🦄🐱🐑</div>
  <div id="inicioBotoes"></div>
</div>
<div id="criador" hidden></div>

<script src="dados.js?v=202611081451"></script>
<script src="arte.js?v=202611081451"></script>
<script src="mundo.js?v=202611081451"></script>
<script src="jogo.js?v=202611081451"></script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:' && /github\.io$/.test(location.hostname)) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
